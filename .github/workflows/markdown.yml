# Markdown checks: lint (relaxed config in .markdownlint-cli2.jsonc, which also checks
# in-page anchors with MD051) and links between files of the repository (lychee, offline).
# External links are checked too, but they never fail the job (sites go down, rate limits).
name: markdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.18.1

      - name: Internal links (relative files)
        uses: lycheeverse/lychee-action@885c65f3dc543b57c898c8099f4e08c8afd178a2 # v2.6.1 (lychee v0.20.1)
        with:
          args: --offline --no-progress --exclude '/issues' './**/*.md'
          fail: true

      - name: External links (informative, never fails the job)
        continue-on-error: true
        timeout-minutes: 3
        uses: lycheeverse/lychee-action@885c65f3dc543b57c898c8099f4e08c8afd178a2 # v2.6.1 (lychee v0.20.1)
        with:
          args: --no-progress --max-retries 2 --timeout 20 --accept '200..=299,403,429' --exclude '/issues' --exclude 'linkedin\.com' './**/*.md'
          fail: false
