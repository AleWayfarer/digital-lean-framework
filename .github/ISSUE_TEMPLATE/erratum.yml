name: Erratum
description: A broken cross-reference, an inconsistent formula, a typo.
title: "[Erratum] "
labels: ["erratum"]
body:
  - type: input
    id: location
    attributes:
      label: File and section
      placeholder: "framework/it/assessment-dli-v2.4.md, Step 4"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong, and what you expected
    validations:
      required: true
